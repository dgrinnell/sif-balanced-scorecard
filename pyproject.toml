[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sif-scorecard"
version = "0.1.0"
description = "Balanced leading/monitoring/lagging safety measurement toolkit for serious injury and fatality (SIF) prevention"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Dan Grinnell" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30", "plotly>=5.18"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
